name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish self-contained
        run: >
          dotnet publish TinyClips/TinyClips.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r win-${{ matrix.platform }}
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.platform }}

      - name: Copy TinyClips.pri (workaround for WinUI 3 publish bug)
        run: |
          $buildOut = "TinyClips/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.22621.0/win-${{ matrix.platform }}"
          $pri = Join-Path $buildOut "TinyClips.pri"
          if (Test-Path $pri) {
            Copy-Item $pri "publish/${{ matrix.platform }}/" -Force
            Write-Host "Copied TinyClips.pri to publish output"
          } else {
            Write-Error "TinyClips.pri not found at $pri — XAML windows will not work"
            exit 1
          }

      - name: Verify publish completeness
        run: |
          $required = @("TinyClips.exe", "TinyClips.pri", "Microsoft.UI.Xaml.Controls.pri")
          foreach ($f in $required) {
            if (-not (Test-Path "publish/${{ matrix.platform }}/$f")) {
              Write-Error "MISSING required file: $f"
              exit 1
            }
          }
          Write-Host "All required files present"

      - name: Create zip
        run: Compress-Archive -Path publish/${{ matrix.platform }}/* -DestinationPath TinyClips-${{ matrix.platform }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: TinyClips-${{ matrix.platform }}
          path: TinyClips-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: TinyClips-x64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: TinyClips-arm64

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            # First release or no previous tag — use all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$TAG")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}")
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 (Intel/AMD) | \`TinyClips-x64.zip\` |"
            echo "| Windows ARM64 (Snapdragon) | \`TinyClips-arm64.zip\` |"
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download the zip for your platform"
            echo "2. Extract to a folder of your choice"
            echo "3. Run \`TinyClips.exe\`"
            echo ""
            echo "No installer needed — TinyClips is a self-contained portable app."
            echo "Requires Windows 10 19041+ (optimized for Windows 11)."
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            TinyClips-x64.zip
            TinyClips-arm64.zip

  winget:
    needs: release
    runs-on: windows-latest

    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: JanOdegard.TinyClips
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
